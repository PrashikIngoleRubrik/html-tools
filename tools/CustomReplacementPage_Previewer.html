<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CustomReplacementPage — Live Previewer</title>
<style>
  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --panel-soft: #f8f9fb;
    --ink: #1c2733;
    --ink-soft: #64748b;
    --border: #dbe1e7;
    --accent: #1c6fa8;
    --accent-strong: #14507b;
    --accent-ink: #ffffff;
    --accent-tint: #e8f2f9;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --err-bg: #fdecec;
    --err-border: #e0a3a3;
    --err-ink: #7a1f1f;
    --shadow: 0 1px 2px rgba(20, 30, 40, 0.06), 0 6px 20px rgba(20, 30, 40, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151a;
      --panel: #181f26;
      --panel-soft: #1d252d;
      --ink: #e6edf3;
      --ink-soft: #93a2b1;
      --border: #2b3742;
      --accent: #6fc2ec;
      --accent-strong: #8fd2f2;
      --accent-ink: #0b1015;
      --accent-tint: #17242c;
      --err-bg: #33191a;
      --err-border: #6e3232;
      --err-ink: #f0b4b4;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #10151a;
    --panel: #181f26;
    --panel-soft: #1d252d;
    --ink: #e6edf3;
    --ink-soft: #93a2b1;
    --border: #2b3742;
    --accent: #6fc2ec;
    --accent-strong: #8fd2f2;
    --accent-ink: #0b1015;
    --accent-tint: #17242c;
    --err-bg: #33191a;
    --err-border: #6e3232;
    --err-ink: #f0b4b4;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 0.85rem 1.5rem;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.25rem;
    flex-wrap: wrap;
    z-index: 1;
  }

  .brand { display: flex; align-items: center; gap: 0.7rem; }

  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    flex: 0 0 auto;
    background: linear-gradient(145deg, var(--accent), var(--accent-strong));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brand-mark svg { width: 16px; height: 16px; }

  header h1 {
    font-size: 0.98rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0.1rem 0 0;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  button {
    font: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.5rem 0.85rem;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: background-color 0.12s ease, border-color 0.12s ease, transform 0.06s ease;
  }

  button svg { width: 14px; height: 14px; flex: 0 0 auto; }

  button:hover { background: var(--panel-soft); border-color: var(--ink-soft); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  button:disabled:hover { background: var(--panel); border-color: var(--border); }

  button.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(320px, 38%) 1fr;
    gap: 1px;
    background: var(--border);
    overflow: hidden;
  }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: 40% 60%; }
  }

  .pane {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .pane-head {
    padding: 0.6rem 1.1rem;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }

  #rowCount {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: normal;
    text-transform: none;
    color: var(--accent);
    background: var(--accent-tint);
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
  }

  #input {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    padding: 1.1rem;
    font-family: var(--mono);
    font-size: 0.78rem;
    line-height: 1.55;
    background: var(--panel);
    color: var(--ink);
  }

  #input::placeholder { color: var(--ink-soft); }

  .preview-scroll {
    flex: 1;
    overflow: auto;
    padding: 1.75rem;
  }

  #error {
    display: none;
    margin: 1rem 1.1rem 0;
    padding: 0.75rem 1rem;
    background: var(--err-bg);
    border: 1px solid var(--err-border);
    color: var(--err-ink);
    border-radius: 8px;
    font-size: 0.8rem;
    white-space: pre-wrap;
    font-family: var(--mono);
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 1.5rem;
    transform: translate(-50%, 8px);
    background: var(--ink);
    color: var(--bg);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 10;
  }

  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* --- the rendered document itself is a fixed white/black "paper",   --- */
  /* --- since it emulates the literal PDF the VF page's XML produces.  --- */
  .paper {
    background: #ffffff;
    color: #000000;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 10pt;
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem clamp(1rem, 3vw, 2.5rem);
    border-radius: 4px;
    border: 1px solid #cfd4d8;
    box-shadow: var(--shadow);
  }

  .paper table {
    border-collapse: collapse;
    width: 100%;
  }

  .paper td, .paper th {
    border: 1px solid #000000;
    padding: 4px 6px;
    vertical-align: middle;
  }

  .paper th { font-weight: bold; }

  .paper[data-empty] {
    color: #8a8f94;
    font-style: italic;
    border-style: dashed;
    box-shadow: none;
    text-align: center;
    padding: 3rem 1rem;
  }

  [data-src-tag] { outline: 1px dashed rgba(255, 0, 0, 0.35); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <path d="M3 9h18M8 9v11"></path>
      </svg>
    </div>
    <div>
      <h1>CustomReplacementPage — Live Previewer</h1>
      <p>Paste the raw XML this VF page returns and see it rendered the way the SBQQ document generator would print it.</p>
    </div>
  </div>
  <div class="toolbar">
    <button id="sampleBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"></path><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"></path></svg>
      Load sample
    </button>
    <button id="clearBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
      Clear
    </button>
    <button id="pngBtn" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
      Save as PNG
    </button>
    <button id="renderBtn" class="primary" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 9-14 9V3Z"></path></svg>
      Render preview
    </button>
  </div>
</header>

<main>
  <section class="pane">
    <div class="pane-head">Paste page source (XML)</div>
    <textarea id="input" spellcheck="false" placeholder="Paste the content of CustomReplacementPage.page here (block / table / table-row / table-cell markup)..."></textarea>
  </section>

  <section class="pane">
    <div class="pane-head">
      <span>Rendered preview</span>
      <span id="rowCount" hidden></span>
    </div>
    <div id="error"></div>
    <div class="preview-scroll">
      <div id="preview" class="paper" data-empty>Paste content on the left, then click &ldquo;Render preview&rdquo;.</div>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
(function () {
  var TAG_MAP = {
    'block': 'div',
    'table': 'table',
    'table-column': 'col',
    'table-header': 'thead',
    'table-body': 'tbody',
    'table-row': 'tr',
    'table-cell': null /* resolved to th/td based on parent */
  };

  var SPAN_ATTRS = {
    'number-rows-spanned': 'rowSpan',
    'number-columns-spanned': 'colSpan'
  };

  var PT_PROPS = { 'font-size': 1, 'line-height': 1 };
  var PX_PROPS = {
    'margin-top': 1, 'margin-bottom': 1, 'margin-left': 1, 'margin-right': 1,
    'padding': 1, 'padding-top': 1, 'padding-bottom': 1, 'padding-left': 1, 'padding-right': 1,
    'border-width': 1, 'width': 1, 'height': 1
  };

  function normalizeValue(prop, value) {
    if (/^-?\d+(\.\d+)?$/.test(value)) {
      if (PT_PROPS[prop]) return value + 'pt';
      if (PX_PROPS[prop]) return value + 'px';
    }
    return value;
  }

  function attrsToStyle(el) {
    var style = '';
    for (var i = 0; i < el.attributes.length; i++) {
      var a = el.attributes[i];
      var name = a.name.toLowerCase();
      if (SPAN_ATTRS[name]) continue;
      style += name + ': ' + normalizeValue(name, a.value) + '; ';
    }
    return style.trim();
  }

  function resolveOutTag(srcTag, parentSrcTag) {
    if (srcTag === 'table-cell') {
      return parentSrcTag === 'table-header' ? 'th' : 'td';
    }
    if (TAG_MAP.hasOwnProperty(srcTag)) return TAG_MAP[srcTag];
    return null;
  }

  function convert(node, parentSrcTag) {
    if (node.nodeType === Node.TEXT_NODE) {
      return node.nodeValue.trim() === '' && node.nodeValue.indexOf('\n') !== -1
        ? null
        : document.createTextNode(node.nodeValue);
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return null;

    var srcTag = node.tagName.toLowerCase();
    var outTag = resolveOutTag(srcTag, parentSrcTag);
    var known = outTag !== null;
    if (!outTag) outTag = 'div';

    var el = document.createElement(outTag);
    if (!known) el.setAttribute('data-src-tag', srcTag);

    var style = attrsToStyle(node);
    if (style) el.setAttribute('style', style);

    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i];
      var lname = a.name.toLowerCase();
      if (SPAN_ATTRS[lname]) el.setAttribute(SPAN_ATTRS[lname] === 'rowSpan' ? 'rowspan' : 'colspan', a.value);
      if (lname === 'width' && outTag === 'col') el.setAttribute('style', 'width:' + a.value + ';');
    }

    for (var c = 0; c < node.childNodes.length; c++) {
      var child = convert(node.childNodes[c], srcTag);
      if (child) el.appendChild(child);
    }
    return el;
  }

  function escapeStrayAmpersands(xml) {
    return xml.replace(/&(?!#\d+;|#x[0-9a-fA-F]+;|[a-zA-Z]+;)/g, '&amp;');
  }

  function parseXml(raw) {
    var wrapped = '<root>' + raw + '</root>';
    var parser = new DOMParser();
    var doc = parser.parseFromString(wrapped, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) {
      var retryDoc = parser.parseFromString('<root>' + escapeStrayAmpersands(raw) + '</root>', 'application/xml');
      if (!retryDoc.getElementsByTagName('parsererror').length) return retryDoc;
      throw new Error(doc.getElementsByTagName('parsererror')[0].textContent.trim());
    }
    return doc;
  }

  function setPngEnabled(enabled) {
    document.getElementById('pngBtn').disabled = !enabled;
  }

  function updateRowCount(preview) {
    var badge = document.getElementById('rowCount');
    var rows = preview.querySelectorAll('tr').length;
    if (rows > 0) {
      badge.textContent = rows + ' row' + (rows === 1 ? '' : 's');
      badge.hidden = false;
    } else {
      badge.hidden = true;
    }
  }

  function render() {
    var raw = document.getElementById('input').value;
    var preview = document.getElementById('preview');
    var errorBox = document.getElementById('error');
    errorBox.style.display = 'none';
    errorBox.textContent = '';

    if (!raw.trim()) {
      preview.innerHTML = 'Paste content on the left, then click &ldquo;Render preview&rdquo;.';
      preview.setAttribute('data-empty', '');
      updateRowCount(preview);
      setPngEnabled(false);
      return;
    }

    try {
      var doc = parseXml(raw);
      var root = doc.documentElement;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < root.childNodes.length; i++) {
        var node = convert(root.childNodes[i], 'root');
        if (node) frag.appendChild(node);
      }
      preview.innerHTML = '';
      preview.removeAttribute('data-empty');
      preview.appendChild(frag);
      updateRowCount(preview);
      setPngEnabled(true);
    } catch (err) {
      errorBox.textContent = 'Could not parse the pasted content as XML:\n' + err.message;
      errorBox.style.display = 'block';
      updateRowCount(preview);
      setPngEnabled(false);
    }
  }

  function showToast(message) {
    var toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  // Paints the rendered table straight onto a canvas using the layout the browser already
  // computed (getBoundingClientRect / getComputedStyle) instead of rasterizing an SVG
  // <foreignObject>. Chrome permanently taints any canvas drawn from a foreignObject image
  // (even same-origin, no external resources), which blocks toBlob/toDataURL — this sidesteps
  // that entirely since nothing is ever drawn via drawImage.
  function isTransparentColor(color) {
    if (!color || color === 'transparent') return true;
    var m = color.match(/rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*([\d.]+)\s*)?\)/);
    return !!m && m[1] !== undefined && parseFloat(m[1]) === 0;
  }

  // Table cells here are fixed-width with no spaces to break on (SKUs, asset IDs), and the
  // live browser preview still wraps those — it treats hyphens as line-break opportunities and
  // hard-breaks mid-token as a last resort, so an unbroken word never overflows its cell. Mirror
  // that here (greedy char scan, preferring the last space/hyphen) or long tokens overflow into
  // the next cell uncovered, since sibling data cells have no opaque background to hide it.
  function wrapTextToWidth(ctx, text, maxWidth) {
    if (maxWidth <= 0) return [text];
    var lines = [];
    var current = '';
    for (var i = 0; i < text.length; i++) {
      var testLine = current + text[i];
      if (current && ctx.measureText(testLine).width > maxWidth) {
        var breakAt = Math.max(current.lastIndexOf(' '), current.lastIndexOf('-'));
        if (breakAt > 0 && breakAt < current.length - 1) {
          lines.push(current.slice(0, breakAt + 1).trimEnd());
          current = current.slice(breakAt + 1) + text[i];
        } else {
          lines.push(current);
          current = text[i];
        }
      } else {
        current = testLine;
      }
    }
    if (current.trim()) lines.push(current.trim());
    return lines.length ? lines : [''];
  }

  function paintNode(ctx, el, origin) {
    var rect = el.getBoundingClientRect();
    var x = rect.left - origin.left;
    var y = rect.top - origin.top;
    var w = rect.width;
    var h = rect.height;
    var cs = getComputedStyle(el);

    if (w > 0 && h > 0) {
      if (!isTransparentColor(cs.backgroundColor)) {
        ctx.fillStyle = cs.backgroundColor;
        ctx.fillRect(x, y, w, h);
      }
      ['Top', 'Right', 'Bottom', 'Left'].forEach(function (side) {
        var bw = parseFloat(cs['border' + side + 'Width']) || 0;
        var style = cs['border' + side + 'Style'];
        if (bw <= 0 || style === 'none') return;
        ctx.fillStyle = cs['border' + side + 'Color'];
        if (side === 'Top') ctx.fillRect(x, y, w, bw);
        else if (side === 'Bottom') ctx.fillRect(x, y + h - bw, w, bw);
        else if (side === 'Left') ctx.fillRect(x, y, bw, h);
        else ctx.fillRect(x + w - bw, y, bw, h);
      });
    }

    var childEls = Array.prototype.slice.call(el.children);
    if (childEls.length) {
      childEls.forEach(function (child) { paintNode(ctx, child, origin); });
      return;
    }

    if (w <= 0 || h <= 0) return;
    var text = (el.textContent || '').replace(/\s+/g, ' ').trim();
    if (!text) return;

    var padL = parseFloat(cs.paddingLeft) || 0;
    var padR = parseFloat(cs.paddingRight) || 0;
    var padT = parseFloat(cs.paddingTop) || 0;
    var padB = parseFloat(cs.paddingBottom) || 0;
    var contentX = x + padL;
    var contentW = Math.max(0, w - padL - padR);
    var contentY = y + padT;
    var contentH = Math.max(0, h - padT - padB);

    var fontSize = parseFloat(cs.fontSize) || 12;
    ctx.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + fontSize + 'px ' + cs.fontFamily;
    ctx.fillStyle = cs.color;

    var lineHeight = parseFloat(cs.lineHeight);
    if (!lineHeight || isNaN(lineHeight)) lineHeight = fontSize * 1.2;

    var lines = wrapTextToWidth(ctx, text, contentW);
    var totalTextHeight = lines.length * lineHeight;
    var firstBaseline = contentY + Math.max(0, (contentH - totalTextHeight) / 2) + (lineHeight + fontSize * 0.72) / 2;

    lines.forEach(function (line, idx) {
      var lineWidth = ctx.measureText(line).width;
      var lineX = contentX;
      if (cs.textAlign === 'center') lineX = contentX + (contentW - lineWidth) / 2;
      else if (cs.textAlign === 'right') lineX = contentX + contentW - lineWidth;
      ctx.fillText(line, lineX, firstBaseline + idx * lineHeight);
    });
  }

  function downloadPng() {
    var preview = document.getElementById('preview');
    if (preview.hasAttribute('data-empty')) return;

    var rect = preview.getBoundingClientRect();
    var width = Math.ceil(rect.width);
    var height = Math.ceil(rect.height);
    var scale = 2;

    var canvas = document.createElement('canvas');
    canvas.width = width * scale;
    canvas.height = height * scale;
    var ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);

    paintNode(ctx, preview, { left: rect.left, top: rect.top });

    canvas.toBlob(function (blob) {
      if (!blob) {
        showToast('Could not generate PNG image.');
        return;
      }
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'replacement-summary-preview.png';
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast('Saved replacement-summary-preview.png');
    });
  }

  var SAMPLE = [
    '<block font-size="6" font-family="Helvetica">',
    '  <block font-weight="bold">Replacement Summary</block>',
    '  <block margin-top="1em" font-size="6">',
    '    <table table-layout="fixed" border-style="solid" border-width="1px">',
    '      <table-column width="10%"/><table-column width="16%"/><table-column width="6%"/>',
    '      <table-column width="6%"/><table-column width="7%"/><table-column width="7%"/>',
    '      <table-column width="7%"/><table-column width="8%"/><table-column width="8%"/>',
    '      <table-column width="11%"/><table-column width="8%"/>',
    '      <table-header>',
    '        <table-row background-color="#35A8DD" color="white">',
    '          <table-cell>Terminated SKU</table-cell>',
    '          <table-cell>Asset ID</table-cell>',
    '          <table-cell>Purchased Qty</table-cell>',
    '          <table-cell>Terminated Qty</table-cell>',
    '          <table-cell>Surviving Quantity</table-cell>',
    '          <table-cell>Original Quote</table-cell>',
    '          <table-cell>Original Order #</table-cell>',
    '          <table-cell>Original Start Date</table-cell>',
    '          <table-cell>Original End Date</table-cell>',
    '          <table-cell>Replacement Product</table-cell>',
    '          <table-cell>Replacement Product Qty</table-cell>',
    '        </table-row>',
    '      </table-header>',
    '      <table-body>',
    '        <table-row>',
    '          <table-cell>RBK-GO-FNDN-R6416</table-cell>',
    '          <table-cell>AA212664160086</table-cell>',
    '          <table-cell>6</table-cell>',
    '          <table-cell>1</table-cell>',
    '          <table-cell>5</table-cell>',
    '          <table-cell>Q-130838</table-cell>',
